# THE ONLY FILE YOU EDIT. Everything is optional: with nothing here the site and sheet still build.
# Edit on GitHub (pencil icon -> Commit). The site rebuilds in about 2 minutes.
#
#   1. calendar   : AUTOMATIC now (economic calendar with consensus + actuals). Only add lines to override;
#                   for a release you add yourself, type the `actual` afterwards. The site then answers the professor's four questions for it (surprise, hawkish/dovish,
#                   what it means for the central bank, did markets react as the reaction map says).
#   2. sp500_view : your Lords of Finance call. It is logged and scored automatically.
#   3. your words : only if you want your own text on the sheet instead of the automatic/AI text.
#                   Set `date` to the market date of the data (e.g. 2026-11-06), otherwise it is ignored.

# ---------------------------------------------------------------- 1. calendar (week ahead + data surprises)
# date: YYYY-MM-DD (needed to sort past vs upcoming). actual: fill in after the release.
week_ahead:
  # Filled automatically from the economic calendar (with consensus and actuals). Add your own lines only to
  # override or add something the calendar lacks; yours win when they cover the same day and region.
  - {date: 2026-12-09, day: "Ahead", region: "US", event: "FOMC decision 9 December", consensus: "", previous: "3.75%-4.00%"}

# Readings the free sources don't have (FRED covers GDP, jobs, CPI, PCE, policy rates, wages).
macro_extra:
  - {name: "Manufacturing PMI (ISM)", latest: "Sep 2026: 54.5 (9th month above 50)", previous: "", measures: "Business survey; above 50 = expansion", impact: "Leading signal for cyclical stocks"}

# ---------------------------------------------------------------- 2. Lords of Finance
sp500_view:
  session_date: ""   # class day of the call, e.g. 2026-11-10
  call: ""           # Long or Short
  reason: ""
  conviction: ""     # low / medium / high

# ---------------------------------------------------------------- 3. your own words for the sheet (optional)
date: ""
overview: ""
highlights: []
performance:
  equities: []
  fixed_income: []
  others: []
sources: []
